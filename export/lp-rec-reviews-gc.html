<style>
.f5-root{font-family:Manrope,sans-serif!important;font-size:18px;line-height:1.5;color:#262626;
  --f5-card:#FFFFFF;--f5-red:#C82925;--f5-violet:#706C91;--f5-violet-deep:#4E4A6E}
.f5-root *{box-sizing:border-box}
.f5-root .f5-wrap{max-width:1140px;margin:0 auto;padding:0 16px}
.f5-root h2{font-family:Manrope,sans-serif!important;font-weight:800;margin:0 0 28px;font-size:26px;line-height:1.2;text-align:center;letter-spacing:-.01em;text-wrap:balance}
.f5-root figure,.f5-root blockquote{margin:0}
.f5-root .f5-rv,.f5-root .f5-rv blockquote,.f5-root .f5-rv figcaption{text-align:left!important}
.f5-root .f5-rv *{font-family:Manrope,sans-serif!important}
@media (min-width:768px){.f5-root h2{font-size:34px;margin-bottom:40px}}
.f5-root .f5-chat{background:linear-gradient(160deg,var(--f5-violet),var(--f5-violet-deep));padding:28px 0;overflow:hidden}
.f5-root .f5-chat h2{color:#fff}
.f5-root .f5-lane{overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.f5-root .f5-lane+.f5-lane{margin-top:16px}
.f5-root .f5-track{display:flex;gap:16px;width:max-content;animation:f5-run 70s linear infinite}
.f5-root .f5-lane-r .f5-track{animation-direction:reverse;animation-duration:60s}
.f5-root .f5-lane:hover .f5-track{animation-play-state:paused}
@keyframes f5-run{to{translate:calc(-50% - 8px) 0}}
.f5-root .f5-rv{flex:0 0 300px;margin:0;background:var(--f5-card);border-radius:20px 20px 20px 6px;padding:18px 20px}
.f5-root .f5-rv figcaption{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--f5-violet);margin-bottom:8px}
.f5-root .f5-ava{flex:0 0 36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;background:var(--f5-violet)}
.f5-root .f5-rv-c1 .f5-ava{background:var(--f5-red)}
.f5-root .f5-rv-c2 .f5-ava{background:#A08F66}
.f5-root .f5-rv blockquote{margin:0;font-size:16px;text-wrap:pretty}
@media (prefers-reduced-motion:reduce){.f5-root .f5-track{animation:none}.f5-root .f5-lane{overflow-x:auto}}
@media (min-width:768px){.f5-root .f5-chat{padding:56px 0}.f5-root .f5-rv{flex-basis:360px}}
:is(.lp-reviews,#f5x) .lt-block-wrapper{background:transparent!important;padding:0!important}
:is(.lp-reviews,#f5x) .container{width:100%!important;max-width:none!important;padding:0!important}
</style>

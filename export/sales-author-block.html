<!-- Блок «Ведущая» для страницы 4775076 (отдельный HTML-блок GetCourse под основным). Оформление — как sales-system-embed.html. Фото в GC — data-URI из исходного блока Ольги. -->
<style>
.sp-author{--cream:#f8f3ea;--paper:#fffdf8;--ink:#1b1023;--ink-soft:#3a2c46;--brass:#E31C79;--purple:#4b2c82;--purple-deep:#221040;--line:rgba(27,16,35,.14);
  font-family:'Manrope',system-ui,sans-serif !important;color:var(--ink);background:var(--paper);border-top:1px solid var(--line);line-height:1.6;font-size:18px;-webkit-font-smoothing:antialiased;padding:96px 0;overflow:hidden}
.sp-author *{box-sizing:border-box;margin:0;padding:0}
.sp-author .sa-wrap{max-width:1120px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:.8fr 1.2fr;gap:64px;align-items:center}
.sp-author .sa-photo{position:relative;border-radius:28px;background:radial-gradient(ellipse 120% 90% at 30% -10%,var(--purple),var(--purple-deep) 65%);aspect-ratio:4/5;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.sp-author .sa-photo::before{content:"";position:absolute;left:50%;top:45%;width:90%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,rgba(227,28,121,.45),rgba(227,28,121,0) 65%)}
.sp-author .sa-photo img{position:relative;display:block;width:82%;max-width:none;height:auto;filter:drop-shadow(0 20px 30px rgba(0,0,0,.3))}
.sp-author .sa-eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.sp-author h2{font-family:'Manrope',system-ui,sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(28px,3.4vw,44px);line-height:1.15;letter-spacing:.01em;color:var(--purple);margin:12px 0 28px}
.sp-author li{text-wrap:pretty}
.sp-author h2{text-wrap:balance}
.sp-author ul{list-style:none}
.sp-author li{padding:14px 0 14px 28px;position:relative;border-top:1px solid var(--line);font-size:19px;color:var(--ink-soft)}
.sp-author li:last-child{border-bottom:1px solid var(--line)}
.sp-author li::before{content:"";position:absolute;left:0;top:27px;width:14px;height:2px;background:var(--brass)}
@media (max-width:860px){
  .sp-author{padding:64px 0;font-size:16px}
  .sp-author .sa-wrap{grid-template-columns:1fr;gap:32px}
  .sp-author .sa-photo{max-width:360px;width:100%;margin:0 auto}
  .sp-author .sa-copy{text-align:center}
  .sp-author li{text-align:left;font-size:17px}
}
</style>
<div class="sp-author">
  <div class="sa-wrap">
    <div class="sa-photo"><img src="IMGSRC" alt="Ольга Грищенко"></div>
    <div class="sa-copy">
      <div class="sa-eyebrow">Автор и&nbsp;ведущая курса</div>
      <h2>Ольга Грищенко</h2>
      <ul>
        <li>Основатель фабрики бизнес-игр&nbsp;F5GAME.RU</li>
        <li>Эксперт по&nbsp;переговорам,&nbsp;практик</li>
        <li>Двукратная чемпионка России по&nbsp;управленческой&nbsp;борьбе</li>
        <li>Автор книги «Эффект красной розы. Книга тайн и&nbsp;секретов&nbsp;убеждений»</li>
        <li>Автор и&nbsp;разработчик&nbsp;50&nbsp;бизнес-игр</li>
      </ul>
    </div>
  </div>
</div>

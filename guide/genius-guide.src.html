<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Гений общения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7B2FF7; --purple-deep:#221040; --purple-mid:#35205e; --purple-soft:#efe8ff;
  --pink:#E31C79; --pink-soft:#fde7f1;
  --lime:#c7ea3f; --green:#34B768; --green-soft:#e3f6ea;
  --ink:#16151F; --ink-soft:#4a4858;
  --paper:#f8f3ea; --white:#fffdf8;
}
@page{ size:A4; margin:18mm 17mm 20mm;
  @bottom-right{ content:counter(page); font:600 10pt Manrope,sans-serif; color:#9a97ab; }
  @bottom-left{ content:"Гений общения · F5GAME.RU"; font:600 9pt Manrope,sans-serif; color:#b4b1c4; letter-spacing:.04em; }
}
@page cover{ margin:0; @bottom-right{content:none} @bottom-left{content:none} }
@page opener{ margin:0; @bottom-right{content:none} @bottom-left{content:none} }
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;background:#fff}
body{font:400 15pt/1.55 Manrope,sans-serif;color:var(--ink)}
h1,h2,h3,.disp{font-family:Unbounded,sans-serif;text-wrap:balance;margin:0}
p,li{text-wrap:pretty;margin:0 0 3mm}

/* ОБЛОЖКА */
.cover{page:cover;height:297mm;position:relative;overflow:hidden;background:var(--purple-deep);color:#fff;padding:22mm 20mm}
.cover::before{content:"";position:absolute;right:-40mm;bottom:-30mm;width:190mm;height:190mm;border-radius:50%;
  background:radial-gradient(circle,rgba(123,47,247,.75) 0%,rgba(123,47,247,.25) 45%,rgba(123,47,247,0) 70%)}
.cover::after{content:"";position:absolute;left:-30mm;top:60mm;width:90mm;height:90mm;border-radius:50%;border:2px solid rgba(199,234,63,.35)}
.cover .logo{position:absolute;left:20mm;bottom:16mm;height:6mm;z-index:2;opacity:.55}
.cover h1{position:relative;z-index:2;margin-top:14mm;font-size:54pt;line-height:.98;font-weight:900;letter-spacing:-.01em;text-transform:uppercase}
.cover h1 span{display:block;color:var(--lime)}
.cover .author{position:relative;z-index:2;font:800 32pt/1.05 Unbounded;color:#fff;letter-spacing:.01em}
.cover .author::after{content:"";display:block;width:16mm;height:3px;background:var(--pink);margin-top:6mm}
.cover .hero{position:absolute;right:-6mm;bottom:22mm;width:205mm;z-index:1}
.cover-img{padding:0}
.cover-img::before,.cover-img::after{display:none}
.cover-img img{display:block;width:210mm;height:297mm;object-fit:cover}
.cover .tag{position:absolute;left:20mm;bottom:22mm;z-index:2;font:800 9pt Unbounded;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}

/* ОТКРЫВАШКА УРОКА */
.opener{page:opener;break-before:page;height:297mm;position:relative;overflow:hidden;padding:22mm 20mm;color:#fff;background:var(--purple)}
.opener.pink{background:var(--pink)}
.opener.deep{background:var(--purple-deep)}
.opener .lvl{font:800 12pt Unbounded;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.opener .num{font:800 36pt/1 Unbounded;color:#fff}
.opener .num small{font-size:28pt;color:#fff;opacity:.55;margin-left:3mm}
.opener .sub{font:800 14pt Unbounded;letter-spacing:.08em;text-transform:uppercase;color:#fff;margin-top:8mm}
.opener .sub+h2{margin-top:3mm}
.opener h2{line-height:1.08;font-weight:800;text-transform:uppercase;max-width:170mm;margin-top:8mm;color:var(--lime)}
.opener .art{position:absolute;right:12mm;bottom:14mm;max-height:130mm;max-width:150mm;z-index:1}
.opener .art.devil{max-height:120mm}
.opener .art[src*="girl-pink"]{max-height:170mm;right:22mm}
.opener .art.edge{bottom:0;right:0;max-width:185mm;max-height:150mm}
.opener .halo{position:absolute;right:-10mm;bottom:-10mm;width:170mm;height:170mm;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,0) 68%)}

/* КОНТЕНТ */
.lesson{break-before:page}
.kicker{font:800 11pt Unbounded;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);margin-bottom:2mm}
h3{font-size:20.5pt;line-height:1.2;font-weight:800;margin:0 0 4mm;color:var(--purple-deep)}
.block{break-inside:avoid;margin:0 0 6mm}
.lead{font-size:17pt;line-height:1.5;font-weight:500}

.case{background:var(--paper);border-radius:5mm;padding:7mm 8mm;position:relative}
.case .kicker{color:var(--pink)}
.case p:last-child{margin-bottom:0}

.poll{border:2px solid var(--purple);border-radius:5mm;padding:6mm 7mm}
.poll .q{font:700 17pt/1.35 Manrope;margin-bottom:4mm}
.poll ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:2.5mm}
.poll li{margin:0;display:flex;align-items:center;gap:3mm;background:var(--purple-soft);border-radius:3mm;padding:3mm 4mm;font-weight:600}
.poll li::before{content:"";flex:none;width:4.5mm;height:4.5mm;border-radius:50%;border:2px solid var(--purple);background:#fff}
.poll .hint{margin-top:3.5mm;font-size:12.5pt;color:var(--ink-soft)}
.poll.single .q{margin:0}

.rule{background:var(--purple-deep);color:#fff;border-radius:5mm;padding:8mm 9mm;position:relative;overflow:hidden}
.rule::after{content:"";position:absolute;right:-14mm;top:-14mm;width:44mm;height:44mm;border-radius:50%;background:var(--purple);opacity:.6}
.rule .kicker{color:var(--lime);position:relative;z-index:1}
.rule .disp{position:relative;z-index:1;font-size:25pt;line-height:1.15;font-weight:800;text-transform:uppercase}

.quote{border-left:3px solid var(--pink);padding:1mm 0 1mm 6mm;font:600 17pt/1.45 Manrope;color:var(--purple-deep)}

.author-note{display:grid;grid-template-columns:38mm 1fr;gap:7mm;align-items:center}
.author-note .ph{width:38mm;height:38mm;border-radius:50%;overflow:hidden;background:var(--pink-soft);box-shadow:0 0 0 2mm var(--pink-soft)}
.author-note .ph{border-radius:5mm !important;height:44mm !important}
.author-note .ph img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 0}

.task-head{background:var(--lime);border-radius:5mm;padding:6mm 8mm;margin-bottom:6mm;break-inside:avoid}
.task-head .kicker{color:var(--purple-deep)}
.task-head h3{margin:0;font-size:23pt}
.task-head p{margin:2mm 0 0;font-weight:600}

/* ТЕХНИКИ */
.tech{break-inside:avoid;display:grid;grid-template-columns:15mm 1fr;gap:5mm;padding:6mm 0;border-top:1px solid #e6e1d6}
.tech .n{font:900 31pt/1 Unbounded;color:var(--purple)}
.tech h4{font:800 17.5pt/1.25 Unbounded;margin:1mm 0 2mm}
.tech .desc{color:var(--ink-soft);margin-bottom:3mm}
.bet{display:flex;align-items:center;gap:2.5mm;font:700 12pt Manrope;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3mm}
.bet i{font-style:normal;display:inline-grid;place-items:center;width:7mm;height:7mm;border:1.5px dashed #b9b4c9;border-radius:2mm;font:800 13pt Unbounded;color:#9a97ab}
.verdict{display:grid;grid-template-columns:9mm 1fr;gap:3.5mm;align-items:start;border-radius:3.5mm;padding:3.5mm 4.5mm}
.verdict b{display:grid;place-items:center;width:9mm;height:9mm;border-radius:50%;font:900 17pt/1 Unbounded;color:#fff}
.verdict p{margin:0}
.verdict p+p{margin-top:2mm}
.tech .desc{margin-bottom:3mm}
.verdict.plus{background:var(--green-soft)} .verdict.plus b{background:var(--green)}
.verdict.minus{background:var(--pink-soft)} .verdict.minus b{background:var(--pink)}
.verdict .ex{margin-top:2mm;font-size:13pt;color:var(--ink-soft)}

.next{text-align:center;font:800 15.5pt Unbounded;color:var(--purple);margin-top:6mm}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5mm}
.card{background:var(--paper);border-radius:4mm;padding:5mm 6mm;break-inside:avoid}
.card h4{font:800 14.5pt Unbounded;margin:0 0 2mm;color:var(--purple)}
.card p{margin:0}

.answer{background:var(--green-soft);border-radius:5mm;padding:6mm 7mm}
.answer .kicker{color:var(--green)}
.answer.wrong{background:#f1eff6}
.answer.wrong .kicker{color:var(--ink-soft)}

.scen{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.scen .card .kicker{color:var(--pink)}

.qtypes{counter-reset:q}
.qt{display:grid;grid-template-columns:40mm 1fr;gap:5mm;align-items:start;padding:4.5mm 0;border-top:1px solid #e6e1d6;break-inside:avoid}
.qt .lbl{font:800 11.5pt Unbounded;text-transform:uppercase;letter-spacing:.03em;padding:2.5mm 3mm;border-radius:2.5mm;text-align:center;color:#fff}
.qt.past .lbl{background:var(--pink)} .qt.now .lbl{background:var(--purple)} .qt.fut .lbl{background:var(--green)}
.qt p{margin:0} .qt .ex{margin-top:1.5mm;font-weight:700;color:var(--purple-deep)}

.swap{display:grid;grid-template-columns:1fr 10mm 1fr;align-items:center;gap:3mm;margin-top:4mm}
.swap div{border-radius:3mm;padding:4mm 5mm;font-weight:700;text-align:center}
.swap .bad{background:var(--pink-soft);color:var(--pink);text-decoration:line-through;text-decoration-thickness:1.5px}
.swap .good{background:var(--green-soft);color:#1f7a45}
.swap span{text-align:center;font:900 17pt Unbounded;color:var(--purple)}

.inline-art{float:right;width:62mm;margin:0 0 4mm 6mm;position:relative}
.inline-art::before{content:"";position:absolute;inset:-4mm;border-radius:50%;background:radial-gradient(circle,rgba(123,47,247,.18),rgba(123,47,247,0) 70%);z-index:-1}
.inline-art img{width:100%}
.clear{clear:both}

/* уроки 4–22 */
.dl{font-weight:600;color:var(--purple-deep);padding-left:5mm;border-left:2px solid var(--pink);margin-bottom:2.5mm}
.case .dl:last-child{margin-bottom:0}
.src{font-size:11.5pt;color:#9a97ab;word-break:break-all;margin-top:3mm}
ul.bul{margin:0 0 3mm;padding-left:6mm} ul.bul li{margin-bottom:1.5mm}
.task-head ul.bul{margin:3mm 0 0;font-weight:600}
.qa{display:grid;grid-template-columns:12mm 1fr;gap:4mm;padding:5mm 0;border-top:1px solid #e6e1d6}
.qa .n{font:900 26.5pt/1 Unbounded;color:var(--pink)}
.qa .qq{font:700 16pt/1.35 Manrope;color:var(--purple-deep);margin-bottom:3mm}
.qa.nonum{grid-template-columns:1fr}
.qa .ans{background:var(--paper);border-radius:3.5mm;padding:4mm 5mm}
.qa .ans p:last-child{margin-bottom:0}
.var{break-inside:avoid;margin:0 0 4.5mm;border-radius:4mm;padding:5mm 6mm;display:grid;grid-template-columns:9mm 1fr;gap:4mm}
.var b.sg{display:grid;place-items:center;width:9mm;height:9mm;border-radius:50%;font:900 17pt/1 Unbounded;color:#fff}
.var .ph{font:700 15.5pt/1.35 Manrope;color:var(--purple-deep);margin-bottom:2mm}
.var p:last-child{margin-bottom:0}
.var.plus{background:var(--green-soft)} .var.plus b.sg{background:var(--green)}
.var.minus{background:var(--pink-soft)} .var.minus b.sg{background:var(--pink)}
.var.neutral{background:var(--purple-soft)} .var.neutral b.sg{background:var(--purple)}
.write{border:2px dashed #c9c3db;border-radius:5mm;padding:6mm 7mm}
.write .q{font:700 16pt/1.35 Manrope;margin-bottom:5mm}
.write .ln{height:9mm;border-bottom:1px solid #d9d4e6}
.ph-img{border:2px dashed var(--purple);border-radius:5mm;min-height:55mm;display:grid;place-items:center;text-align:center;color:var(--purple);font:700 13pt Manrope;background:var(--purple-soft);padding:6mm}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4mm}
.cycle{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin-bottom:6mm;break-inside:avoid}
.cycle div{background:var(--purple-deep);color:#fff;border-radius:4mm;padding:5mm;text-align:center;font:800 13pt/1.3 Unbounded}
.cycle img{height:30mm;display:block;margin:0 auto 3mm}
.herocard{break-inside:avoid;display:grid;grid-template-columns:42mm 1fr;gap:6mm;align-items:center;background:var(--paper);border-radius:5mm;padding:5mm 7mm;margin-bottom:5mm}
.herocard img{width:100%;max-height:52mm;object-fit:contain}
.herocard h4{font:900 20.5pt Unbounded;color:var(--purple);margin:0 0 2mm}
.herocard p:last-child{margin-bottom:0}
.step{break-inside:avoid;display:grid;grid-template-columns:auto 1fr;gap:5mm;align-items:start;margin:0 0 5mm}
.step .tag{background:var(--lime);font:900 13pt Unbounded;border-radius:3mm;padding:3mm 4mm;white-space:nowrap}
.step p:last-child{margin-bottom:0}
.poll1{border:2px solid var(--purple);border-radius:5mm;padding:6mm 7mm;display:grid;grid-template-columns:10mm 1fr;gap:4mm;align-items:center}
.poll1::before{content:"?";display:grid;place-items:center;width:10mm;height:10mm;border-radius:50%;background:var(--purple);color:#fff;font:900 18pt Unbounded}
.poll1 .q{font:700 17pt/1.35 Manrope}
.pic{text-align:center;position:relative}
.pic img{max-height:105mm;max-width:100%}
.pic img[src*="box-genius"]{max-height:88mm}
.pic img[src*="book-necklace"]{max-height:150mm;border-radius:2mm}
.pic img[src*="film-"]{width:100%;max-height:none;border-radius:5mm}
h3,.kicker{break-after:avoid}
.rule.long .disp{font-size:18pt;line-height:1.3;text-transform:none;font-weight:700}
.finale{break-before:page;page:opener;height:297mm;position:relative;overflow:hidden;background:var(--purple-deep);color:#fff;padding:40mm 20mm}
.finale h2{font-size:34pt;line-height:1.08;font-weight:900;text-transform:uppercase;color:var(--lime);max-width:160mm}
.finale p{font-size:17pt;line-height:1.5;max-width:150mm;margin-top:10mm}
.finale .sign{font:800 20pt/1.3 Unbounded}
.finale p+.sign{margin-top:14mm}
.finale .art{position:absolute;right:14mm;bottom:0;height:150mm}
.finale .halo{position:absolute;right:-20mm;bottom:-30mm;width:170mm;height:170mm;border-radius:50%;background:radial-gradient(circle,rgba(123,47,247,.6),rgba(123,47,247,0) 68%)}
.stage{font-style:italic;color:var(--ink-soft)}
</style>
</head>
<body>

<!-- ОБЛОЖКА -->
<section class="cover cover-img">
  <img src="img/cover.jpg" alt="Гений общения. Автор: Ольга Грищенко">
</section>

<!--LESSONS-->
</body>
</html>
